name: Import reviewed source
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'pallwalt/famai-star-map' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and import reviewed source
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, stat, zipfile
          archive = pathlib.Path('famai-star-map-source.zip')
          expected = 'd507b7a6453f7c2f4126196c7e0040d770aa5b76f7cda8b9343f6de57842c75e'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Archive checksum mismatch'
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              assert len(entries) == 247
              assert len({x.filename for x in entries}) == 247
              for item in entries:
                  p = pathlib.PurePosixPath(item.filename)
                  assert p.parts[0] == 'famai-star-map' and len(p.parts) > 1
                  assert not p.is_absolute() and '..' not in p.parts and '.' not in p.parts
                  assert '.git' not in p.parts and not item.is_dir()
                  assert not stat.S_ISLNK(item.external_attr >> 16)
                  relative = pathlib.Path(*p.parts[1:])
                  assert (root / relative).resolve().is_relative_to(root)
                  if relative.parts[:2] == ('.github', 'workflows'):
                      continue
                  relative.parent.mkdir(parents=True, exist_ok=True)
                  relative.write_bytes(z.read(item))
          archive.unlink()
          print('Imported 244 reviewed files. Three workflow files require the owner web upload.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'Publish reviewed Famaiverse source and open-source documentation'
          git push origin HEAD:main

